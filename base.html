<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        {% block title %}
        Email Analysis System
        {% endblock %}
    </title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >

</head>

<body>

<header>

    <div class="navbar">

        <a
            href="{{ url_for('index') }}"
            class="logo"
        >
            Email Analyzer
        </a>

        <nav>

            <a href="{{ url_for('index') }}">
                Analyze
            </a>

            <a href="{{ url_for('history') }}">
                History
            </a>

        </nav>

    </div>

</header>


<main class="container">

    {% with messages = get_flashed_messages() %}

        {% if messages %}

            {% for message in messages %}

                <div class="alert">
                    {{ message }}
                </div>

            {% endfor %}

        {% endif %}

    {% endwith %}


    {% block content %}

    {% endblock %}

</main>


<footer>

    <p>
        Email Analysis System
    </p>

</footer>


<script
    src="{{ url_for('static', filename='script.js') }}"
></script>

</body>

</html>
